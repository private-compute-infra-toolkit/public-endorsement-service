syntax = "proto3";

package google.pes.proto;

option java_multiple_files = true;
option java_outer_classname = "TsaConfigProto";
option java_package = "com.google.pes.proto";

// Configuration for RFC 3161 TimeStamp Authority (TSA) timestamping.
message TsaConfig {
  // Explicit marker indicating that TSA timestamping is disabled.
  message Disabled {}

  // Configuration for enabled TSA timestamping.
  message Enabled {
    // List of HTTP or HTTPS URLs of configured TSA endpoints.
    repeated string tsa_urls = 1;
  }

  // Timestamping mode. Must be explicitly set to either disabled or enabled.
  oneof mode {
    // Explicitly disables TSA timestamping.
    Disabled disabled = 1;

    // Enables TSA timestamping with the configured TSA endpoint URLs.
    Enabled enabled = 2;
  }
}
